<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patho 326 — Exam 1 sorting drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F3; --surface:#FFFFFF; --surface-2:#F7F9FA; --surface-3:#FAFBFC;
  --ink:#1F262C; --ink-2:#56646F; --ink-3:#8896A1;
  --rule:#D5DCE2; --rule-2:#E8ECEF; --rule-3:#F0F3F5;
  --accent:#2F5D8C; --accent-soft:#E6EEF7; --accent-line:#A8C0D8;
  --ok:#17694D; --ok-bg:#E8F3EE; --ok-rule:#A9CFBF;
  --bad:#A32017; --bad-bg:#FBE7E5; --bad-rule:#E0A29B;
  --flag:#7A5C12; --flag-bg:#FAF3E0; --flag-rule:#E2D3A6;
  --sans:"Atkinson Hyperlegible","Segoe UI",Tahoma,Verdana,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --bank-w:330px;
  --head-h:120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.012em}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--rule)}
.topbar-inner{max-width:1460px;margin:0 auto;padding:11px 20px 0;position:relative}
.titlerow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.titlerow h1{font-size:16.5px}
.titlerow .sub{color:var(--ink-3);font-size:13px}
.metrics{margin-left:auto;display:flex;gap:18px;align-items:center}
.metric{display:flex;gap:6px;align-items:baseline;font-size:13px;color:var(--ink-2);white-space:nowrap}
.metric b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.reviewbtn{min-height:44px;padding:5px 14px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);cursor:pointer;font-size:13px}
.reviewbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.tabs{display:flex;gap:1px;overflow-x:auto;margin-top:9px;scrollbar-width:thin}
.tab{
  flex:0 0 auto;min-height:44px;padding:8px 14px 9px;background:none;border:0;
  border-bottom:3px solid transparent;cursor:pointer;color:var(--ink-2);
  font-size:13.5px;white-space:nowrap;text-align:left;
}
.tab .n{color:var(--ink-3);font-size:11.5px;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab .bonusdot{color:var(--flag);font-weight:700;font-size:11.5px}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.progress i{display:block;height:2px;width:0;background:var(--ok);transition:width .25s ease-out}

/* ---------- layout ---------- */
.wrap{max-width:1460px;margin:0 auto;padding:24px 20px 56px;display:flex;gap:26px;align-items:flex-start}
.main{flex:1 1 auto;min-width:0}
.bank-col{flex:0 0 var(--bank-w);width:var(--bank-w);position:sticky;top:calc(var(--head-h) + 14px);align-self:flex-start}

.roundhead{margin-bottom:16px;max-width:74ch}
.roundhead h2{font-size:25px;line-height:1.18}
.roundhead p{margin:7px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.5}

/* notes */
.notes{margin:16px 0 26px;display:flex;flex-direction:column;gap:8px;max-width:84ch}
.note{
  font-size:13.5px;line-height:1.5;padding:10px 13px;border-left:3px solid var(--flag-rule);
  background:var(--flag-bg);color:var(--flag);border-radius:0 4px 4px 0;
}
.note b{color:#5D4608}
.note.added{border-left-color:var(--accent-line);background:var(--accent-soft);color:#2C4763}
.note.added b{color:#1D3550}

/* ---------- board ---------- */
.groupname{
  font-size:14px;font-weight:700;color:var(--ink);margin:30px 0 11px;padding-bottom:7px;
  border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.groupname:first-child{margin-top:0}
.groupname em{font-style:normal;color:var(--ink-3);font-size:12.5px;font-weight:400}
.groupname .gct{margin-left:auto;color:var(--ink-3);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.board{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));
  gap:14px;align-items:start;
}

.box{
  background:var(--surface);border:1px solid var(--rule);border-radius:5px;
  display:flex;flex-direction:column;position:relative;min-width:0;
  transition:border-color .12s,box-shadow .12s;
}
.box-head{
  padding:10px 12px;background:var(--surface-3);border-bottom:1px solid var(--rule-2);
  border-radius:5px 5px 0 0;display:flex;align-items:flex-start;gap:8px;
}
.box.done .box-head{background:var(--ok-bg);border-bottom-color:var(--ok-rule)}
.box-seq{
  flex:0 0 auto;font-size:11px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  min-width:20px;text-align:center;padding:0 5px;line-height:17px;margin-top:2px;
}
.box-name{font-size:14.5px;font-weight:700;line-height:1.28;flex:1 1 auto;min-width:0;letter-spacing:-0.005em;overflow-wrap:break-word}
.box-count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}
.box-tap{
  flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1px solid var(--accent-line);
  color:var(--accent);font-size:11px;font-weight:700;line-height:18px;text-align:center;
  margin-top:1px;display:none;font-style:italic;
}
.box.tappable .box-tap{display:block}
.box.tappable{cursor:pointer}
.box.tappable:hover .box-tap{background:var(--accent);border-color:var(--accent);color:#fff}
.box-body{padding:9px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box-body:empty{padding:0;margin:9px;min-height:52px;border:1px dashed var(--rule-2);border-radius:4px}
.box-flagline{font-size:11.5px;color:var(--flag);background:var(--flag-bg);border-top:1px solid var(--flag-rule);padding:6px 12px;line-height:1.35}
.box.bonus .box-head{background:var(--flag-bg);border-bottom-color:var(--flag-rule)}

/* drag affordance */
.armed .box{border-color:var(--accent-line)}
.armed .box-body:empty{border-color:var(--accent-line)}
.box.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.box.over .box-body:empty{border-color:var(--accent);background:var(--accent-soft)}
.box.over .box-head{background:var(--accent-soft)}
.box.kbtarget{outline:3px solid var(--accent);outline-offset:2px}
.box.reject{border-color:var(--bad-rule)}
.box.reject .box-head{background:var(--bad-bg)}
.box.reject .box-body:empty{border-color:var(--bad-rule);background:var(--bad-bg)}

.placed{background:var(--ok-bg);border:1px solid var(--ok-rule);border-left:3px solid var(--ok);border-radius:4px;padding:8px 10px;min-width:0;overflow-wrap:break-word}
.placed .p-term{font-weight:700;font-size:14px;color:var(--ok);line-height:1.3}
.placed .p-clue{font-size:12.5px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.placed .p-fact{font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--ink);margin-top:6px;padding-top:6px;border-top:1px solid var(--ok-rule)}
.placed.flagged{background:var(--flag-bg);border-color:var(--flag-rule);border-left-color:var(--flag)}
.placed.flagged .p-term{color:var(--flag)}
.placed.flagged .p-fact{border-top-color:var(--flag-rule)}
.p-badge{display:inline-block;font-size:10.5px;border:1px solid var(--flag-rule);color:var(--flag);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;background:#fff;font-weight:400}

/* ---------- word bank ---------- */
.bank{background:var(--surface);border:1px solid var(--rule);border-radius:5px;display:flex;flex-direction:column;min-height:0;overflow:hidden;max-height:calc(100vh - var(--head-h) - 46px)}
.bank-top{padding:10px 12px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:9px;flex:0 0 auto}
.bank-top h3{font-size:14.5px;flex:1 1 auto}
.bank-left{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.iconbtn{min-height:44px;padding:6px 11px;border:1px solid var(--rule);background:var(--surface);border-radius:4px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.bank-ctrls{border-bottom:1px solid var(--rule);background:var(--surface-2);flex:0 0 auto;max-height:52vh;overflow-y:auto}
.bank-ctrls[hidden]{display:none}
.ctrl-row{padding:11px 12px;display:flex;flex-direction:column;gap:10px}
.ctrl-cap{font-size:12px;color:var(--ink-3);margin-bottom:-4px}
.seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{flex:1 1 0;min-height:44px;border:0;background:none;cursor:pointer;font-size:12.5px;color:var(--ink-2);padding:6px 4px;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ctrl-line{display:flex;align-items:center;gap:10px;min-height:44px}
.ctrl-line label{font-size:13px;color:var(--ink-2);flex:1 1 auto;cursor:pointer}
.switch{position:relative;width:48px;height:44px;flex:0 0 auto}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch span{position:absolute;left:2px;right:2px;top:9px;height:26px;background:var(--rule);border-radius:13px;transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.btn-row{display:flex;gap:8px}
.btn-row .iconbtn{flex:1 1 0;text-align:center}

.bank-list{overflow-y:auto;overflow-x:hidden;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
.tile{
  display:block;width:100%;max-width:100%;text-align:left;min-height:44px;padding:9px 11px;
  overflow-wrap:break-word;flex:0 0 auto;
  background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--ink-3);
  border-radius:4px;cursor:grab;font-size:14px;line-height:1.32;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;
}
.tile .t-term{font-weight:700;display:block}
.tile .t-clue{display:block;color:var(--ink-2);font-size:13px;margin-top:3px;line-height:1.4}
.tile.sel{border-color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.tile.lifting{opacity:.28}
.tile.wrong{animation:shake .4s;border-color:var(--bad-rule);background:var(--bad-bg)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.bank-empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.55}
.bank-hint{padding:0 12px 10px;font-size:12px;color:var(--ink-3);line-height:1.45}

.ghost{
  position:fixed;z-index:80;pointer-events:none;background:var(--surface);overflow-wrap:break-word;
  border:1px solid var(--accent);border-left:3px solid var(--accent);border-radius:4px;
  padding:9px 11px;font-size:14px;line-height:1.32;box-shadow:0 10px 26px rgba(20,34,48,.24);
  max-width:300px;
}
.ghost .t-term{font-weight:700;display:block}
.ghost .t-clue{display:block;color:var(--ink-2);font-size:13px;margin-top:3px}
.flyback{position:fixed;z-index:80;pointer-events:none;transition:transform .26s ease-out,opacity .26s}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,30,38,.46);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.scrim[hidden]{display:none}
.sheet{background:var(--surface);border-radius:6px;max-width:740px;width:100%;box-shadow:0 20px 56px rgba(15,24,34,.32);margin:auto 0}
.sheet-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:17px 22px;display:flex;gap:12px;align-items:flex-start;border-radius:6px 6px 0 0;z-index:2}
.sheet-head h3{font-size:20px;line-height:1.25;flex:1 1 auto}
.sheet-head .kicker{font-size:12.5px;color:var(--ink-3);margin-bottom:3px}
.closex{min-width:44px;min-height:44px;border:1px solid var(--rule);background:var(--surface);border-radius:4px;cursor:pointer;font-size:16px;line-height:1}
.sheet-body{padding:6px 22px 22px}
.sec{padding:16px 0;border-bottom:1px solid var(--rule-3)}
.sec:last-child{border-bottom:0}
.sec h4{font-size:13px;color:var(--accent);margin-bottom:7px}
.sec p,.sec li{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink);max-width:72ch}
.sec p{margin:0 0 8px}
.sec ul{margin:0;padding-left:19px}
.sec li{margin-bottom:8px}
.sec li b{font-family:var(--sans);font-size:14px}
.sec .sub{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin-top:-3px;margin-bottom:9px}
.sheet .note{margin:14px 0 0}

/* results */
.resultgrid{display:flex;gap:30px;flex-wrap:wrap;padding:16px 0 6px}
.bignum{font-size:36px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bignum + .lbl{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.missitem{padding:11px 0;border-bottom:1px solid var(--rule-3)}
.missitem:last-child{border-bottom:0}
.missitem .m-term{font-weight:700;font-size:14.5px}
.missitem .m-line{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.missitem .m-line b{color:var(--ok)}
.missitem .m-line i{font-style:normal;color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:18px}
.abtn{min-height:44px;padding:10px 16px;border:1px solid var(--rule);background:var(--surface);border-radius:4px;cursor:pointer;font-size:14px}
.abtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;padding:14px 0;align-items:start}
.keybox{border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
.keybox h5{margin:0 0 6px;font-size:13.5px}
.keybox ul{margin:0;padding-left:17px}
.keybox li{font-size:13px;line-height:1.5;color:var(--ink-2);margin-bottom:4px}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- narrow screens ---------- */
@media (max-width:980px){
  .board{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
}
@media (max-width:900px){
  :root{--head-h:112px}
  .wrap{display:block;padding:18px 14px calc(var(--bank-h, 320px) + 28px)}
  .bank-col{position:fixed;left:0;right:0;bottom:0;width:auto;top:auto;z-index:50;padding:0}
  .bank{border-radius:0;border-left:0;border-right:0;border-bottom:0;max-height:48vh;box-shadow:0 -8px 24px rgba(20,34,48,.16)}
  .bank-ctrls{max-height:34vh}
  .board{grid-template-columns:1fr;gap:11px}
  .roundhead h2{font-size:21px}
  .sheet{max-width:none}
  .scrim{padding:10px}
  .metrics{width:100%;margin-left:0;order:3;gap:16px;padding-top:2px}
  .groupname{margin:24px 0 10px}
}
@media (hover:none){
  .tile{cursor:default}
  .box.tappable{cursor:default}
}
@media (hover:hover){
  .tile:hover{border-color:var(--accent-line)}
  .box.tappable:hover{border-color:var(--accent-line)}
  .iconbtn:hover,.abtn:hover,.closex:hover{border-color:var(--accent);color:var(--accent)}
  .abtn.primary:hover{color:#fff;opacity:.92}
  .tab:hover{color:var(--ink)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="titlerow">
      <h1>Patho 326 &mdash; Exam 1 sorting drill</h1>
      <span class="sub" id="scopeline">40 questions &middot; 5 blueprint sections</span>
      <div class="metrics">
        <span class="metric" id="m-placed"><b>0</b>/<b id="m-total">0</b> placed</span>
        <span class="metric">wrong drops <b id="m-wrong">0</b></span>
        <span class="metric">time <b id="m-time">0:00</b></span>
        <button class="reviewbtn" id="reviewToggle" aria-pressed="false">Review mode</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Rounds"></nav>
    <div class="progress" aria-hidden="true"><i id="progFill"></i></div>
  </div>
</header>

<div class="wrap">
  <main class="main">
    <div class="roundhead">
      <h2 id="roundTitle"></h2>
      <p id="roundBlurb"></p>
    </div>
    <div class="notes" id="roundNotes"></div>
    <div id="boardHost"></div>
  </main>

  <div class="bank-col" id="bankCol">
    <section class="bank" aria-label="Word bank">
      <div class="bank-top">
        <h3>Word bank</h3>
        <span class="bank-left" id="bankLeft"></span>
        <button class="iconbtn" id="ctrlToggle" aria-expanded="true" aria-controls="bankCtrls">Hide controls</button>
      </div>
      <div class="bank-ctrls" id="bankCtrls">
        <div class="ctrl-row">
          <div class="ctrl-cap">Tiles show</div>
          <div class="seg" role="group" aria-label="What shows on tiles">
            <button data-name="term" aria-pressed="false">Term</button>
            <button data-name="clue" aria-pressed="true">Clue</button>
            <button data-name="both" aria-pressed="false">Both</button>
          </div>
          <div class="ctrl-line">
            <label for="countsChk">Show how many fit each box</label>
            <span class="switch"><input type="checkbox" id="countsChk"><span></span></span>
          </div>
          <div class="btn-row">
            <button class="iconbtn" id="shuffleBtn">Shuffle bank</button>
            <button class="iconbtn" id="restartBtn">Restart round</button>
          </div>
          <div class="ctrl-cap">Drag a tile onto a box, or tap a tile then tap a box. Keyboard: Enter picks up, Tab moves between boxes, Enter drops.</div>
        </div>
      </div>
      <div class="bank-list" id="bankList"></div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <div style="flex:1 1 auto">
        <div class="kicker" id="sheetKicker"></div>
        <h3 id="sheetTitle"></h3>
      </div>
      <button class="closex" id="sheetClose" aria-label="Close">&#10005;</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
/* =========================================================================
   CONTENT
   Sourced from: Exam_1_Blueprint.docx, Exam_1_Study_Guide_Worksheet.docx,
   Week_1_Infection, Week_1_Immunity, Week_2_Alterations_in_immunity,
   Week_3_Fluid_and_Electrolytes (slide decks, OCR'd from page images).
   Items marked "added" are not in those files. Verify with your instructor.
   ========================================================================= */

var ROUNDS = [];

/* ---------------- ROUND 1 ---------------- */
ROUNDS.push({
  id: "r1",
  title: "Introduction to Pathophysiology",
  blurb: "5 of the 40 exam questions. Sort each definition and scenario under the term it belongs to.",
  notes: [
    {type:"added", html:"<b>No slide deck for this unit was uploaded.</b> This whole round is built from the Exam 1 study guide worksheet plus standard pathophysiology definitions. Anything the worksheet did not state is marked <em>added</em> on the tile. Check these against the lecture you attended."}
  ],
  groups: [
    {label:"Framework terms", sub:"what the field is and what a cause is", ids:["p1","p2"]},
    {label:"Where the cause came from", sub:"the three etiology labels", ids:["p3","p4","p5"]},
    {label:"Measuring how common a disease is", sub:"new cases versus existing cases", ids:["p6","p7"]},
    {label:"Patterns of occurrence in a population", sub:"baseline, above baseline, across continents", ids:["p8","p9","p10"]}
  ],
  boxes: [
    {id:"p1", name:"Pathophysiology", card:{
      how:"Physiology describes how the body works when nothing is wrong. Pathophysiology picks up where that stops: it describes what function looks like once disease or injury has disrupted it.",

      watch:"Antibiotics do not penetrate the fungal wall, so antifungals are required. Worse, antibiotics destroy normal resident flora and open the door to fungal overgrowth.",
      nursing:"A patient on broad-spectrum antibiotics who develops oral thrush or a vaginal yeast infection is showing this mechanism, not a new unrelated problem.",
      apart:[
        {t:"Candida albicans",d:"The most common one, opportunistic, and becomes disseminated in immunocompromised patients. It also reappears in Round 5 as an AIDS opportunistic infection."},
        {t:"Dermatophytes",d:"The subset that invades skin, hair, and nails. Cause tineas, that is, ringworm."},
        {t:"Normal flora",d:"Certain fungi are normal to skin and mucous membranes. They only become pathogens when the balance shifts."}
      ]
    }},

      watch:"Two symptom patterns in the deck: gastrointestinal when ingested, and fever with chills and rigor when the parasite is in the blood.",

        {t:"Blood presentation",d:"Fever, chills, and rigor point to a blood-borne parasite."},

      watch:"Droplet and airborne are not the same size. The deck distinguishes droplet nuclei larger than 5 micrometers traveling under a meter from aerosolized particles under 5 micrometers that can travel farther.",

  items: [
    {id:"i301", box:"f1", term:"Pathogen", clue:"A disease-producing microbe", fact:"The umbrella term. The worksheet asks for it as a fill-in-the-blank."},
    {id:"i302", box:"f1", term:"Pathogenicity", clue:"Qualities that promote the production of disease", fact:"Promotes disease. Compare with virulence, which is about severity."},
    {id:"i303", box:"f1", term:"Virulence", clue:"The potential of a pathogen to produce disease", fact:"Potential severity, not how easily it spreads."},
    {id:"i304", box:"f1", term:"Infectivity", clue:"The proportion of exposures needed to cause infection", fact:"How readily it takes hold. High infectivity drives isolation decisions."},
    {id:"i305", box:"f1", term:"Toxigenicity", clue:"The ability of a pathogen to produce harmful toxins", fact:"One of the three mechanisms of infection: exposing host cells to toxins."},
    {id:"i306", box:"f1", term:"Antigenicity", clue:"The level to which a pathogen is viewed by the host as foreign", fact:"How visible the pathogen is to the immune system."},
    {id:"i307", box:"f1", term:"Antigenic variability", clue:"The ability to undergo genetic variation and go unrecognized by the host", fact:"Reappears as a reason viruses succeed and as a host defense failure in Round 5."},
    {id:"i308", box:"f1", term:"Coinfection", clue:"Two or more pathogens present simultaneously", fact:"Simultaneous. Contrast with superinfection, which is sequential."},
    {id:"i309", box:"f1", term:"Superinfection", clue:"An infection that arises on top of one already present", fact:"On top of an existing infection. The classic setting is antibiotic therapy."},
    {id:"i310", box:"f1", term:"Opportunistic", clue:"Causes disease in an immunocompromised host", fact:"Ties directly to the AIDS opportunistic infections in Round 5."},
    {id:"i311", box:"f2", term:"Single-celled", clue:"Organisms made of one cell that can reproduce independently under the right conditions", fact:"Worksheet blank. Independent reproduction is the contrast with viruses."},
    {id:"i312", box:"f2", term:"Rigid cell wall", clue:"The structure that is the target of antibiotic treatment", fact:"Why antibiotics work on bacteria and not on viruses."},
    {id:"i313", box:"f2", term:"Capsule", clue:"Makes the organism more adherent and more resistant to phagocytosis", fact:"A virulence feature, not a structural requirement."},
    {id:"i314", box:"f2", term:"Endospores", clue:"Survive in a latent state through environmental extremes and lack of nutrients, then emerge when conditions improve", fact:"Explains why some organisms survive routine cleaning and require sporicidal agents."},
    {id:"i315", box:"f2", term:"Cocci, bacilli, vibrio", clue:"Naming based on morphology, that is, on shape", fact:"The naming convention for this pathogen class."},
    {id:"i316", box:"f2", term:"Aerobic vs. anaerobic", clue:"Classified by whether oxygen is required for growth", fact:"Determines culture handling and drug choice."},
    {id:"i317", box:"f2", term:"Survives outside the host", clue:"Independent survival away from a living host", fact:"The property that most cleanly separates this class from viruses."},
    {id:"i318", box:"f3", term:"Beta-lactamase", clue:"An enzyme produced by resistant strains that destroys penicillin", fact:"Inactivation of the antibiotic, the deck's named penicillin resistance mechanism."},
    {id:"i319", box:"f3", term:"MRSA", clue:"Methicillin-resistant Staphylococcus aureus", fact:"Methicillin had been used against penicillin-resistant organisms; resistance followed it."},
    {id:"i320", box:"f3", term:"Efflux pumps", clue:"Increased active transport of the drug back out of the organism", fact:"Ejects the antibiotic rather than destroying it."},
    {id:"i321", box:"f3", term:"Target molecule modification", clue:"The structure the drug binds to changes so the drug no longer fits", fact:"Third named mechanism alongside inactivation and efflux."},
    {id:"i322", box:"f3", term:"Stopping antibiotics early", clue:"A patient stops taking the drug as soon as symptoms improve", fact:"Worksheet multiple choice. It allows more resistant organisms to survive and reproduce."},
    {id:"i323", box:"f3", term:"Frequent unnecessary antibiotics", clue:"A patient who repeatedly receives antibiotics that were not indicated", fact:"Worksheet multiple choice: this patient is at greatest risk for a resistant organism."},
    {id:"i324", box:"f3", term:"Develops ways to withstand the drug", clue:"Microorganisms develop characteristics that allow them to resist the effects of an antibiotic", fact:"Worksheet blank. The answer word is resist."},
    {id:"i325", box:"f3", term:"Bactericidal", clue:"Kills the microorganism outright", fact:"Contrast with bacteriostatic, which only inhibits growth until the body clears it."},
    {id:"i326", box:"f4", term:"Requires a living host cell", clue:"Cannot replicate without entering a living cell", fact:"Worksheet blank AND multiple choice. The single cleanest discriminator from bacteria."},
    {id:"i327", box:"f4", term:"Capsid around nucleic acid", clue:"The basic structure is nucleic acid protected by a protein coat", fact:"Some are additionally enclosed in a lipoprotein envelope."},
    {id:"i328", box:"f4", term:"Binds specific cell receptors", clue:"Enters host cells by attaching to particular receptors, then replicates", fact:"Deck practice question: this is WHY influenza damages specific cells, not because it multiplies anywhere warm and moist."},
    {id:"i329", box:"f4", term:"Latency", clue:"Dormancy: the agent integrates into the host genome and reactivates during immunocompromise", fact:"Herpes simplex (cold sores) and herpes zoster (shingles) are the deck's examples."},
    {id:"i330", box:"f4", term:"Oncogenesis", clue:"Causes infected cells to become malignant", fact:"One of three listed damage mechanisms, alongside disrupting protein synthesis and promoting apoptosis."},
    {id:"i331", box:"f5", term:"Mycosis", clue:"The name for an infection with this type of organism", fact:"Superficial, deep, or opportunistic."},
    {id:"i332", box:"f5", term:"Dermatophytes", clue:"Invade skin, hair, and nails and cause the tineas", fact:"Tinea is ringworm. Not a worm."},
    {id:"i333", box:"f5", term:"Candida albicans", clue:"The most common one; opportunistic, and disseminates in immunocompromised patients", fact:"Also listed as an AIDS opportunistic infection in Round 5."},
    {id:"i334", box:"f5", term:"Needs an antifungal, not an antibiotic", clue:"Antibiotics do not penetrate this organism's wall", fact:"And antibiotics make it worse by destroying the normal flora that held it in check."},
    {id:"i335", box:"f6", term:"Transmitted by a vector", clue:"Carried by a mosquito, tick, or flea", fact:"Same vectors appear under indirect, vector-borne transmission."},
    {id:"i336", box:"f6", term:"Cramping, abdominal pain, bloody diarrhea", clue:"The symptom pattern after ingestion of contaminated water or food", fact:"Points to the ingestion route rather than the blood-borne one."},
    {id:"i337", box:"f6", term:"Fever, chills, and rigor", clue:"The symptom pattern when the organism is in the blood", fact:"Distinguishes blood-borne from gastrointestinal presentation."},
    {id:"i338", box:"f7", term:"Body fluids across mucous membranes", clue:"Fluid from the host reaches the mucous membranes of a second host", fact:"No intermediate object, so this is direct."},
    {id:"i339", box:"f7", term:"Animal bite", clue:"Rabies is the deck's example", fact:"Direct contact with the reservoir animal."},
    {id:"i340", box:"f7", term:"Contaminated soil", clue:"Systemic mycosis acquired through soil contact", fact:"Listed under DIRECT routes in the deck even though soil feels like an object. Go with the slide."},
    {id:"i341", box:"f7", term:"Via the placenta", clue:"HIV passed directly to the fetus", fact:"Called vertical transmission. Contrast with all the horizontal routes."},
    {id:"i342", box:"f8", term:"Vehicle borne", clue:"Carried to the host by contaminated water, food, clothing, plasma, or tissues", fact:"Fomites belong in this subtype."},
    {id:"i343", box:"f8", term:"Airborne aerosols", clue:"Suspension of particles in the air; COVID-19, Legionnaires disease, measles", fact:"Particles under 5 micrometers can travel a longer distance."},
    {id:"i344", box:"f8", term:"Vector borne", clue:"Insects carry it: West Nile virus, Lyme disease, malaria", fact:"The deck calls this mechanical transmission."},
    {id:"i345", box:"f8", term:"Fomites", clue:"Contaminated inanimate objects that carry the agent between people", fact:"Listed on the chain-of-infection slide under means of transmission."}
  ]
});

    }},
    {id:"m15", name:"Cell-mediated immunity (T cells)", card:{
      how:"Recognition and destruction of cells carrying non-self antigens. An APC presents antigen to a helper T cell, IL-1 and IL-2 are produced, cytotoxic T cells are cloned, and they hunt and destroy target cells.",
      where:"Virus-infected cells, cells transformed by cancer, and transplanted tissue.",
      watch:"T lymphocytes MATURE AND DIFFERENTIATE IN THE THYMUS, and require contact with an antigen to differentiate further.",
      nursing:"This is the arm HIV destroys. Losing CD4 helper T cells collapses both cell-mediated and humoral responses, because helper T cells support both.",
      apart:[
        {t:"Helper T cells (CD4)",d:"Process antigens and present them to BOTH B and T cells. Release the cytokine IL-2."},
        {t:"Cytotoxic T cells (CD8)",d:"Produced in response to IL-2. Destroy the target cell using cytolytic enzymes, perforins, and toxic cytokines."},

        {t:"Memory cells",d:"Retained for future use, same principle as memory B cells."},
        {t:"Maturation site",d:"THYMUS. The single cleanest contrast with B cells."},
        {t:"vs. NK cells",d:"Cytotoxic T cell destruction is SPECIFIC. NK cell destruction is NONSPECIFIC."}

    }},
    {id:"m16", name:"Naturally acquired active immunity", card:{
      how:"You met the antigen in the wild and your own immune system built the response. Antibodies and T cells are produced after natural exposure.",

      watch:"Active means your body did the work, so it is LONG LIVED. Natural means no medical product was involved.",
      nursing:"Documented natural infection can substitute for vaccination in some screening protocols, which is why the history question gets asked.",
      apart:[
        {t:"The two-axis grid",d:"Active vs. passive = who made the antibodies. Natural vs. artificial = whether a medical intervention was involved. Every question is one cell in that grid."},

      ]
    }},

      how:"Immunization introduces the antigen deliberately, and your own immune system builds the response to it.",
      where:"Any vaccine. The deck names immunization explicitly as a route to active immunity.",

      nursing:"Antibody production takes weeks, so a vaccine given at exposure does not protect against that exposure.",
      apart:[
        {t:"vs. Artificially acquired passive",d:"Both involve a medical product. A VACCINE gives you an antigen and you make antibodies (active). An IMMUNE GLOBULIN injection gives you the antibodies ready-made (passive)."},

      ]
    }},
    {id:"m18", name:"Naturally acquired passive immunity", card:{
      how:"Preformed antibodies are transferred from one person to another without any medical product. The recipient makes nothing.",
      where:"Maternal antibodies crossing the placenta to the fetus. Antibodies in breast milk.",
      watch:"Passive immunity is TEMPORARY or SHORT LIVED, because the recipient never built memory. That is the property questions test.",
      nursing:"Maternal antibody wanes over the first months of life, which is why the infant immunization schedule is timed the way it is.",
      apart:[

    {id:"m19", name:"Artificially acquired passive immunity", card:{

        {t:"RhoGAM",d:"A crossover item. It is passive artificial immunity, and it is also the prevention for the Type II reaction in Round 5."},
        {t:"Timing logic",d:"Use passive when protection is needed NOW. Use active when protection is needed later and durably."}

    {id:"m20", name:"Healing and tissue repair", bonus:true, card:{
      how:"Four overlapping stages: hemostasis, inflammation, proliferative, and remodeling. Clotting first, then pathogen clearance, then fibroblasts and collagen, then restoring structural integrity.",

        {t:"Secondary intention",d:"Large, craterlike wound that heals from the BOTTOM UP. Slow, greater infection risk, greater scarring."},
        {t:"Resolution",d:"Mild injury, rapid healing, epithelial cells slough and regenerate."},
        {t:"Regeneration",d:"Only possible in cells that can undergo mitotic division. Involves proliferation and differentiation."},

  items: [
    {id:"i401", box:"m1", term:"Skin and mucous membranes", clue:"The structures named as the first line of defense", fact:"Barriers come before any immune cell is involved."},
    {id:"i402", box:"m1", term:"Lysozyme in tears", clue:"An enzyme in tears that kills many bacteria", fact:"Tears also wash away irritating substances and microbes."},
    {id:"i403", box:"m1", term:"Cilia sweeping trapped organisms", clue:"Mucus traps organisms and these structures sweep them out of the airway", fact:"The mucus escalator. Metaplasia in a smoker destroys it."},
    {id:"i404", box:"m1", term:"Stomach acid", clue:"Kills organisms before they go further down the tract", fact:"Acid-suppressing therapy reduces this barrier."},
    {id:"i405", box:"m1", term:"Urine washing the urethra", clue:"Flow through this tract flushes microbes out", fact:"Why an indwelling catheter and urinary stasis raise infection risk."},
    {id:"i406", box:"m1", term:"Normal flora of the large intestine", clue:"Resident bacteria that keep invaders in check", fact:"Destroying them with antibiotics allows selective overgrowth of resistant or fungal organisms."},
    {id:"i407", box:"m2", term:"First responders of inflammation", clue:"The first wave of cells to arrive at the site of injury", fact:"Worksheet answer for the early phase of acute inflammation."},
    {id:"i408", box:"m2", term:"Most important in rapid bacterial response", clue:"The granulocyte named as most important in the rapid response to bacterial infection", fact:"Neutropenia removes this response, which is why neutropenic fever is an emergency."},
    {id:"i409", box:"m3", term:"Protection against parasites", clue:"The granulocyte whose listed role is defense against parasitic organisms", fact:"Eosinophilia points to parasites or allergy, not ordinary bacterial infection."},
    {id:"i410", box:"m3", term:"Regulates the histamine response", clue:"Named on the cellular response slide as the regulator of histamine", fact:"Regulates, in contrast with basophils and mast cells, which release."},
    {id:"i411", box:"m4", term:"Complement mast cells", clue:"Granulocytes important in establishing allergic reactions", fact:"Basophils. They establish the allergic reaction rather than regulate it."},
    {id:"i412", box:"m4", term:"Housed in connective tissue near vessels", clue:"White blood cells stationed throughout connective tissue close to blood vessels", fact:"Their location is why the vascular response is so fast."},
    {id:"i413", box:"m4", term:"Degranulation releasing histamine", clue:"The release step that produces the earliest vascular changes", fact:"The same step becomes Type I hypersensitivity when IgE triggers it inappropriately."},
    {id:"i414", box:"m5", term:"Arrive after 24 hours", clue:"Cells that reach the site a day after the first wave, then differentiate", fact:"Monocytes. The 24-hour delay is testable."},
    {id:"i415", box:"m5", term:"Display antigen markers on their surface", clue:"Ingest antigen-carrying cells, then present markers for T and B lymphocytes", fact:"This is the bridge from innate to adaptive immunity."},
    {id:"i416", box:"m5", term:"Release pyrogens", clue:"The cells that release the substances that travel to the hypothalamus and cause fever", fact:"Macrophages. Naming the cell AND the hypothalamus is the testable pair."},
    {id:"i417", box:"m5", term:"Regulate granuloma formation", clue:"The cell that controls the nodular lesions of chronic inflammation", fact:"Macrophages again, in the chronic setting."},
    {id:"i418", box:"m6", term:"Critical to displaying antigen to T cells", clue:"Cells whose listed job is processing and displaying antigen to T lymphocytes", fact:"Narrower role than the macrophage, which also phagocytoses and causes fever."},
    {id:"i419", box:"m6", term:"Carries poison ivy antigen to the lymph node", clue:"Picks up the antigen in the epidermis and transports it to the nearest node", fact:"The first step of the Type IV contact dermatitis mechanism in Round 5."},
    {id:"i420", box:"m7", term:"Nonspecific cellular antigen destruction", clue:"Kills target cells without prior exposure or antigen presentation", fact:"NK cells. Nonspecific is the word that separates them from cytotoxic T cells."},
    {id:"i421", box:"m7", term:"Lymphoid origin but innate function", clue:"Comes from the lymphoid progenitor line yet belongs to innate immunity", fact:"A common trap: lymphoid lineage does not automatically mean adaptive."},
    {id:"i422", box:"m8", term:"Vasodilation", clue:"Increase in vascular diameter", fact:"Produces the redness and heat of local inflammation."},
    {id:"i423", box:"m8", term:"Increased vascular permeability", clue:"Gaps form between endothelial cells that are normally packed tightly together", fact:"Produces the edema and the pain."},
    {id:"i424", box:"m8", term:"Exudate", clue:"Watery fluid with high protein and leukocyte concentration", fact:"Transports leukocytes and antibodies, dilutes toxins, and carries nutrients for repair."},
    {id:"i425", box:"m9", term:"Chemotaxis", clue:"The process of moving cells to the site of injury", fact:"The directional signal, not the binding and not the crossing."},
    {id:"i426", box:"m9", term:"Cellular adherence", clue:"Attracting and binding cells at the site of injury", fact:"The step between chemotaxis and migration."},
    {id:"i427", box:"m9", term:"Diapedesis", clue:"Cells moving between and through endothelial junctions", fact:"The deck defines this word a second time, differently, on the remodeling slide. Note the conflict above."},
    {id:"i428", box:"m9", term:"Platelets form the structural origin of repair", clue:"Stop bleeding and lay the groundwork for tissue repair", fact:"Listed under the cellular response, not under healing."},
    {id:"i429", box:"m10", term:"Complement system", clue:"Circulating inactive proteins that, once activated, opsonize, recruit leukocytes, inflame locally, and lyse the pathogen", fact:"Named directly on the blueprint. Brings about BOTH innate and adaptive immunity."},
    {id:"i430", box:"m10", term:"Insoluble fibrin strands", clue:"The product of the system whose purpose is to stop the bleed", fact:"Clotting system. It also triggers the kinin system."},
    {id:"i431", box:"m10", term:"Bradykinin and kallidin", clue:"Powerful vasodilators that increase permeability and cause smooth muscle contraction", fact:"Kinin system. PAIN is the classic sign they produce."},
    {id:"i432", box:"m10", term:"Hageman factor XII", clue:"The factor that links the clotting and kinin systems", fact:"Named on both the clotting and kinin slides."},
    {id:"i433", box:"m10", term:"Opsonins", clue:"Bind to the microbe and activate binding of phagocytic cells", fact:"Adaptive immunity responds to opsonins too, not just innate."},

    {id:"i435", box:"m10", term:"Interleukins and chemokines", clue:"Low molecular weight proteins mediating interaction between immune and tissue cells", fact:"Cytokines. They function in BOTH innate and adaptive immunity."},
    {id:"i436", box:"m11", term:"Loss of function", clue:"The fifth cardinal sign, after redness, heat, swelling, and pain", fact:"Worksheet fill-in-the-blank. The one people leave out."},
    {id:"i437", box:"m11", term:"Erythema at a wound edge", clue:"Redness surrounding a cut", fact:"Worksheet distractor. Local, not systemic."},

    {id:"i439", box:"m12", term:"Pyrexia", clue:"Fever produced when pyrogens reach the hypothalamus", fact:"Purpose per the deck: increases metabolism, facilitating healing and phagocytosis."},

    {id:"i441", box:"m12", term:"Fever and generalized malaise", clue:"The finding that indicates inflammation is no longer confined to the site", fact:"Worksheet multiple choice answer for systemic inflammation."},
    {id:"i442", box:"m13", term:"Lasts longer than six months", clue:"The duration the deck gives for this form of inflammation", fact:"Duration plus cell mix are the two discriminators."},
    {id:"i443", box:"m13", term:"Proteinases from monocytes", clue:"Enzymes responsible for ongoing tissue destruction", fact:"The mechanism behind sustained damage rather than resolution."},
    {id:"i444", box:"m13", term:"Granuloma formation", clue:"Nodular inflammatory lesions that encase harmful substances", fact:"Regulated by macrophages, to protect surrounding unaffected tissue."},
    {id:"i445", box:"m13", term:"Anemia, anorexia, weight loss", clue:"General manifestations beyond those of acute inflammation", fact:"Plus malaise, fatigue, and weakness."},
    {id:"i446", box:"m14", term:"Plasma cells", clue:"What B lymphocytes become; they produce and secrete antibodies", fact:"Worksheet fill-in-the-blank: these cells produce antibodies. They are the effector cells and then undergo apoptosis."},
    {id:"i447", box:"m14", term:"Develops in the bone marrow", clue:"The lymphocyte line that develops here rather than in the thymus", fact:"B cells. Reversing this with the thymus is a classic error."},
    {id:"i448", box:"m14", term:"IgM", clue:"The immunoglobulin class that rises first", fact:"First up. Useful marker of recent infection."},
    {id:"i449", box:"m14", term:"IgA", clue:"The immunoglobulin found in body secretions", fact:"Secretions: tears, saliva, breast milk, mucosal surfaces."},
    {id:"i450", box:"m14", term:"IgE", clue:"The immunoglobulin of allergic responses", fact:"Drives Type I hypersensitivity via mast cell binding in Round 5."},
    {id:"i451", box:"m14", term:"Variable region", clue:"The part of the antibody that allows binding to a specific antigen", fact:"The constant region forms the Y shape and is the most stable component."},
    {id:"i452", box:"m14", term:"Neutralization and agglutination", clue:"Two of the four listed antibody functions", fact:"The other two are opsonization and activation of complement."},
    {id:"i453", box:"m15", term:"Matures in the thymus", clue:"The lymphocyte line that matures and differentiates here", fact:"T cells. Contrast directly with bone marrow for B cells."},
    {id:"i454", box:"m15", term:"CD4 helper T cell", clue:"Processes antigen, presents it to both B and T cells, and releases IL-2", fact:"The cell HIV destroys, which is why both immune arms collapse in AIDS."},
    {id:"i455", box:"m15", term:"CD8 cytotoxic T cell", clue:"Produced in response to IL-2; destroys targets with cytolytic enzymes, perforins, and toxic cytokines", fact:"Specific destruction, in contrast with the nonspecific NK cell."},
    {id:"i456", box:"m15", term:"Recognition of non-self antigens on MHC", clue:"Identifies cells infected by virus or transformed by cancer", fact:"The definition of cell-mediated immunity in the deck."},
    {id:"i457", box:"m16", term:"Recovering from chickenpox", clue:"Your own antibodies after meeting the organism in the wild", fact:"Active because you made it, natural because no product was involved. Long lived."},
    {id:"i458", box:"m16", term:"Antibodies produced after natural exposure", clue:"Antibodies or T cells produced following exposure to an antigen in daily life", fact:"Worksheet fill-in-the-blank for active immunity, natural route."},
    {id:"i459", box:"m17", term:"Immunization", clue:"Antibodies or T cells produced by your own system after a deliberate antigen exposure", fact:"Named on the slide as a route to active immunity. Still long lived."},
    {id:"i460", box:"m17", term:"Vaccine given weeks before travel", clue:"Deliberate antigen exposure timed to allow the response to build", fact:"Antibody production takes weeks, so timing matters.", badge:"added"},
    {id:"i461", box:"m18", term:"Antibodies across the placenta", clue:"A newborn receives antibodies from the mother before birth", fact:"Worksheet multiple choice. Naturally acquired PASSIVE immunity, all four grid cells offered."},
    {id:"i462", box:"m18", term:"Antibodies in breast milk", clue:"Preformed antibodies transferred to an infant through feeding", fact:"Passive and natural. Temporary, because the infant builds no memory.", badge:"added"},
    {id:"i463", box:"m19", term:"Immune globulin injection", clue:"Ready-made antibodies given as a medical product after an exposure", fact:"Immediate but short lived, and it creates no memory.", badge:"added"},
    {id:"i464", box:"m19", term:"RhoGAM", clue:"Preformed antibody given to an Rh-negative mother", fact:"Also the prevention for hemolytic disease of the newborn in Round 5."},
    {id:"i465", box:"m19", term:"Transferred from donor to recipient", clue:"Preformed antibodies or T lymphocytes moved from one person to another artificially", fact:"Slide wording for passive immunity. Temporary or short lived."},
    {id:"i466", box:"m20", term:"Primary intention", clue:"Approximated wound edges, low infection risk, minimal scarring", fact:"A clean surgical closure."},
    {id:"i467", box:"m20", term:"Secondary intention", clue:"Large craterlike wound that heals from the bottom up", fact:"Slow, greater infection risk, greater scarring."},
    {id:"i468", box:"m20", term:"Dehiscence", clue:"Deficient scar formation; the wound splits open", fact:"Cause is INADEQUATE collagen formation."},
    {id:"i469", box:"m20", term:"Keloid", clue:"A hypertrophic scar from excessive collagen production", fact:"The mirror image of dehiscence: too much collagen instead of too little."},
    {id:"i470", box:"m20", term:"Adhesion", clue:"A fibrous connection between serous cavities and nearby tissues", fact:"A healing complication, not a stage of healing."},
    {id:"i471", box:"m20", term:"Replacement with scar tissue", clue:"What happens when regeneration is not possible", fact:"Regeneration restores function; replacement settles for structure."}

        {t:"Hemolytic disease of the newborn",d:"Rh factor on the red cell surface. Rh positive can receive positive or negative; Rh NEGATIVE can receive only Rh negative blood. RhoGAM is the prevention."},
        {t:"Myasthenia gravis",d:"Antibodies against the NICOTINIC ACETYLCHOLINE RECEPTOR at the neuromuscular junction. B cells involved, thymus thought to be involved. Ptosis and diplopia, and muscle weakness after exercise THAT IMPROVES WITH REST. The deck labels it Type IIa."},
        {t:"Graves disease",d:"Named as a Type II example on the mechanism slide."}

    {id:"a6", name:"Type III hypersensitivity", card:{
      how:"Immune-complex mediated. Antigen-antibody complexes form, get DEPOSITED in tissues or vessels, activate complement, and draw in PMN leukocytes.",

      apart:[

        {t:"Rheumatoid arthritis",d:"Antibody complexes IgM to IgG. Effect listed as arthritis. Note that the deck also lists RA in the Type IV table."},
        {t:"Post-streptococcal glomerulonephritis",d:"Target is STREPTOCOCCAL CELL WALL antigens. Effect is nephritis."},
        {t:"Polyarteritis nodosa",d:"Target is HEPATITIS B VIRUS SURFACE antigen. Effect is systemic vasculitis. The one driven by a named virus."},
        {t:"Serum sickness",d:"Various antigens. Arthritis, vasculitis, and nephritis together."},
        {t:"Farmer's lung",d:"INHALED antigens, mold or dust. Alveolar inflammation. The only inhalational entry in the table."},
        {t:"Henoch-Schonlein purpura",d:"Cause unknown, likely a respiratory pathogen. Purpura and glomerulonephritis."},
        {t:"Arthus reaction",d:"Various antigens; cutaneous vasculitis."}
      ]
    }},
    {id:"a7", name:"Type IV hypersensitivity", card:{
      how:"CELL-MEDIATED, not antibody-mediated. T cells attack by direct cytotoxicity from CD8 cells, or by a delayed hypersensitivity response from antigen-specific T cells.",
      where:"Contact dermatitis and eczema, the tuberculin reaction, granulomas, persistent asthma, and a long list of autoimmune diseases.",
      watch:"DELAYED is the timing word. The tuberculin reaction PEAKS AT 48 TO 72 HOURS, which is exactly why a PPD is read two or three days later.",
      nursing:"A patient told to return in 48 to 72 hours for a TB skin test reading is being timed against this mechanism.",
      apart:[
        {t:"Contact dermatitis",d:"Environmental chemicals: poison ivy, poison oak, nickel. Skin necrosis, inflammation, rash, blisters. Mechanism: antigen enters the epidermis, combines with small proteins, a DENDRITIC CELL carries it to the lymph node, T cells recognize it, macrophages release cytokines, and redness and edema follow."},
        {t:"Tuberculin (Mantoux)",d:"Peak at 48 to 72 hours. INDURATION and erythema around the injection site indicate PREVIOUS EXPOSURE."},
        {t:"Type 1 diabetes mellitus",d:"Target is pancreatic beta cell proteins. Insulitis and beta cell destruction."},
        {t:"Multiple sclerosis",d:"Target is MYELIN antigens, specifically myelin basic protein. Myelin destruction and inflammation."},
        {t:"Hashimoto thyroiditis",d:"Target is THYROGLOBULIN antigen. Hypothyroidism and a HARD GOITER."},
        {t:"Inflammatory bowel disease",d:"Target is enteric microbiota and self-antigens."},
        {t:"Autoimmune myocarditis",d:"Target is MYOSIN HEAVY CHAIN protein. Cardiomyopathy."},
        {t:"Peripheral neuropathies",d:"Target is SCHWANN CELL antigen. Neuritis and paralysis."},
        {t:"Granulomas",d:"Walled-off lesion containing macrophages and other cells. Also appears in chronic inflammation in Round 4."}
      ]
    }},
    {id:"a8", name:"Autoimmunity mechanisms", card:{
      how:"Complex disorders with no single cause. Heredity supplies susceptibility genes and epigenetic change, and an environmental trigger sets it off. The underlying malfunction is in adaptive immunity's ability to distinguish self from non-self.",
      where:"Underlies lupus, rheumatoid arthritis, type 1 diabetes, multiple sclerosis, and Hashimoto thyroiditis.",
      watch:"Three named mechanisms: self-reactive T and B cells that were not eliminated by the thymus, override of the mechanisms that inactivate T lymphocytes, and molecular mimicry.",
      nursing:"Exacerbation and remission is the usual course, so patient teaching centers on recognizing a flare and identifying triggers.",
      apart:[
        {t:"Susceptibility genes",d:"Inherited. You inherit the risk, not the disease."},
        {t:"Epigenetics",d:"Changes in gene EXPRESSION rather than in DNA sequence. The distinction is the testable part."},
        {t:"Molecular mimicry",d:"Close resemblance between a foreign antigen and a self antigen, so the response aimed at the pathogen hits the host. Post-streptococcal disease is the classic pattern."},
        {t:"Thymic failure",d:"Self-reactive T and B cells not eliminated by the thymus. Links back to the thymus as the T cell maturation site in Round 4."},
        {t:"Environmental triggers",d:"Viral infection, drug or chemical exposure."}
      ]
    }},
    {id:"a9", name:"Systemic lupus erythematosus", card:{
      how:"A chronic MULTISYSTEM inflammatory autoimmune disease, mediated as a TYPE III hypersensitivity reaction. Acquired sensitivity to auto-antigens, auto-reactive CD4 T cells, and B cell hyperactivity producing autoantibodies. Circulating immune complexes deposit in skin, kidneys, joints, and other organs.",
      where:"Affects women of childbearing age. Course is exacerbations and remissions.",
      watch:"Triggering events per the deck: viral infection, hormones, genetic predisposition, drugs, SUNLIGHT, thermal burns, and physical stress. Sun exposure as a trigger is a direct teaching point.",
      nursing:"Sun protection, flare recognition, and monitoring renal function. Glomerulonephritis is the complication that changes prognosis.",
      apart:[
        {t:"Butterfly rash",d:"The malar rash across the cheeks and bridge of the nose. One of the eleven ACR criteria."},
        {t:"Photosensitivity",d:"Both a manifestation and a trigger. Sunlight is listed as a triggering event."},
        {t:"Renal involvement",d:"Glomerulonephritis and PROTEINURIA. The organ that drives outcome."},
        {t:"Cardiopulmonary",d:"Pericarditis, heart murmur, pleural effusions, pleuritis, and even pulmonary embolism or pulmonary hypertension."},
        {t:"CNS",d:"Diplopia, ataxia, seizures, ptosis, cognitive dysfunction, psychosis."},
        {t:"Hematologic",d:"Anemia, leukopenia, thrombocytopenia. Three cell lines down at once."},
        {t:"ANA",d:"Antinuclear antibody. Fits the Type III target antigen, which is nuclear antigens."},
        {t:"Diagnostic threshold",d:"Four of eleven ACR criteria, per the deck."},
        {t:"Ptosis overlap",d:"Ptosis appears in both SLE (CNS involvement) and myasthenia gravis. If a question gives ptosis alone, look for the second finding."}
      ]
    }},
    {id:"a10", name:"Transplant rejection and GVHD", card:{
      how:"Alloimmunity: the immune response to tissue from another person. Graft rejection is an adaptive response mediated by T lymphocytes, both CD4 and CD8, recognizing alloantigens.",
      where:"Solid organ transplant and bone marrow transplant.",
      watch:"The direction of attack is the whole distinction. In rejection the HOST attacks the GRAFT. In graft versus host disease the DONOR's T cells attack the RECIPIENT.",
      nursing:"GVHD symptoms are rash, diarrhea, and liver disease. Those three together after a marrow transplant are the pattern.",
      apart:[
        {t:"Graft rejection",d:"T lymphocyte mediated, CD4 and CD8, against alloantigens. Host versus graft."},
        {t:"Hyperacute rejection",d:"Mediated by ALLOANTIBODIES rather than T cells. The fastest form, and the one with a different mechanism from the others."},
        {t:"Graft versus host disease",d:"Donor T cells attack recipient cells. Classified as a TYPE IV hypersensitivity reaction. Rash, diarrhea, liver disease."},
        {t:"The cross-link",d:"GVHD is the one item here that also belongs to a hypersensitivity type. If a question asks which type, the answer is IV."}
      ]
    }}

  boxes: [
    {id:"e1", name:"Fluid compartments", bonus:true, card:{
      how:"Total body water is about 60% of body weight, split into two functional compartments. Intracellular fluid is two thirds of total body water; extracellular fluid is one third.",
      where:"Extracellular fluid is plasma plus interstitial fluid, with a small transcellular portion.",
      watch:"The major cations flip by compartment: potassium inside the cell, sodium outside. Getting that backwards makes every electrolyte question harder than it needs to be.",
      nursing:"Intake and output and daily weight are how compartment volume is actually tracked at the bedside.",
      apart:[
        {t:"Intracellular",d:"Two thirds of total body water, about 40% of body weight, roughly 28 liters. Major cation POTASSIUM."},
        {t:"Extracellular",d:"One third of total body water, about 20% of body weight. Major cation SODIUM. Plasma plus interstitial fluid."},
        {t:"Interstitial",d:"About 10 liters, versus roughly 1 liter transcellular."},
        {t:"Normal osmolality",d:"275 to 295 mOsm/kg."}
      ]
    }},
    {id:"e2", name:"Transport and fluid movement", bonus:true, card:{
      how:"One active mechanism and two passive ones. The sodium-potassium ATPase pump moves 3 sodium out and 2 potassium in, using energy. Osmosis moves water; diffusion moves solute.",
      where:"Every cell membrane, continuously.",
      watch:"Osmosis moves WATER toward higher particle concentration. Diffusion moves SOLUTE from high to low concentration. Opposite directions of travel, which is why they get confused.",
      nursing:"This is the reason rapid correction of sodium is dangerous: water follows the gradient into or out of brain cells.",
      apart:[
        {t:"Na/K ATPase pump",d:"ACTIVE transport. 3 sodium out, 2 potassium in. The 3-and-2 ratio is the memorizable part."},
        {t:"Osmosis",d:"WATER moves toward the area of higher sodium or particle concentration."},
        {t:"Diffusion",d:"SOLUTE moves down its concentration gradient, high to low."},
        {t:"Osmolality",d:"Number of particles per unit of water. Normal 275 to 295 mOsm/kg."},
        {t:"ECF concentrations",d:"Potassium about 4 mEq/L and sodium about 140 mEq/L in extracellular fluid."}
      ]
    }},
    {id:"e3", name:"Regulation of sodium and water", bonus:true, card:{
      how:"Sensors detect a change, hormones respond. Osmoreceptors sense rising osmolality and falling volume; baroreceptors sense falling pressure. Both drive ADH release. RAAS responds to reduced renal blood flow.",
      where:"Hypothalamic thirst center, posterior pituitary, aortic arch and carotid bodies, kidney, adrenal cortex.",
      watch:"ADH holds onto WATER. Aldosterone holds onto SODIUM, and water follows it. Both raise volume, by different routes.",
      nursing:"The kidney is named as the major regulator of sodium and fluid. Body need is about 2000 mg sodium per day; typical American intake is 5,000 to 6,000 mg or more.",
      apart:[
        {t:"Osmoreceptors",d:"Sensory neurons in the hypothalamic THIRST center. Respond to increased osmolality and decreased blood volume."},
        {t:"Baroreceptors",d:"AORTIC ARCH and CAROTID. Sense a drop in blood volume and pressure."},
        {t:"ADH",d:"Released from the PITUITARY. Increases water reabsorption by increasing permeability of the collecting tubules, and DECREASES urine output."},
        {t:"Renin",d:"Released because of DECREASED BLOOD FLOW TO THE KIDNEYS. Starts the cascade."},
        {t:"Angiotensin II",d:"Converted from angiotensin I in the LUNGS. Causes vasoconstriction, raising blood pressure, and triggers aldosterone release."},
        {t:"Aldosterone",d:"From the ADRENAL gland. Increases SODIUM reabsorption into blood, so sodium and water are retained."},
        {t:"Where sodium goes",d:"Water tends to follow. That one sentence explains most of this round."}
      ]
    }},
    {id:"e4", name:"Fluid volume deficit", bonus:true, card:{
      how:"Loss exceeds intake, so circulating volume falls. Hypovolemia.",
      where:"Vomiting and diarrhea, hemorrhage, diuretics, fever and sweating, poor oral intake.",
      watch:"Orthostatic hypotension and tachycardia are compensation, not the problem. The heart speeds up to defend a falling stroke volume.",
      nursing:"Intake and output, urine output, daily weight, vital signs, assessing the cause of the loss, and watching for poor perfusion.",
      apart:[
        {t:"Signs",d:"Thirst, dry mucous membranes, weight loss, FLATTENED neck veins, diminished skin turgor, prolonged capillary refill, decreased urine output, increased heart rate, decreased blood pressure, altered level of consciousness."},
        {t:"Neck veins",d:"FLAT in deficit, DISTENDED in excess. A single bedside finding that splits the two."},
        {t:"Deck question",d:"Which client is at risk for deficient fluid volume? The one with a colostomy, or the one receiving frequent wound irrigations. Heart failure and decreased kidney function are the excess-volume distractors."},
        {t:"Compensation",d:"1 liter of water weighs 2.2 pounds, so daily weight is a sensitive volume measure."}
      ]
    }},
    {id:"e5", name:"Fluid volume excess", bonus:true, card:{
      how:"Gain exceeds excretion, so extracellular volume rises. Hypervolemia.",
      where:"Heart failure, kidney failure, excess IV fluids, liver disease, high sodium intake.",
      watch:"Crackles and dyspnea mean fluid has reached the lungs. That is the finding that changes urgency.",
      nursing:"Daily weight, intake and output, lung sounds and respiratory status, edema, and monitoring response to therapy.",
      apart:[
        {t:"Signs",d:"Edema, rapid weight gain, jugular venous distention, crackles and dyspnea, bounding pulses, increased blood pressure, increased respiratory rate, pitting edema in dependent areas."},
        {t:"Edema consequences",d:"Decreases oxygen and nutrient delivery to tissue, causing skin breakdown and impaired gas exchange. Also reduces joint mobility and capillary blood flow."},
        {t:"Grading",d:"Finger pressure graded non-pitting, trace, and 1+ through 4+. The deck notes the meanings vary by depth versus time."},
        {t:"Deck question",d:"Which client is at risk for excess fluid volume? The client with renal failure. Diuretics, ileostomy, and GI suctioning are all deficit risks."}

    {id:"e6", name:"Hyponatremia", bonus:true, card:{

        {t:"The nursing-sensitive cause",d:"Poor access to water. A patient who cannot reach the cup is a patient at risk."}
      ]
    }},
    {id:"e8", name:"Hypokalemia", bonus:true, card:{
      how:"Potassium below 3.5 mEq/L. Membrane excitability falls, so muscle and gut go quiet and the heart becomes irritable.",
      where:"Loop and thiazide diuretics, vomiting and diarrhea, poor intake, insulin shifting potassium into cells, hyperaldosteronism.",

      apart:[

        {t:"Signs",d:"Muscle weakness, fatigue, constipation or ileus, leg cramps, dysrhythmias and ECG changes."},

        {t:"Why check magnesium",d:"Potassium is hard to correct while magnesium is low. Both slides list checking the other."},
        {t:"ECG",d:"The deck's dysrhythmia figure shows a prominent U wave and ST depression with low potassium."}

    {id:"e9", name:"Hyperkalemia", bonus:true, card:{

        {t:"Threshold",d:"Above 5.1 mEq/L."},

        {t:"Recheck the result",d:"A hemolyzed specimen can produce a falsely high potassium. Recheck unexpected results is on the slide."},

    {id:"e10", name:"Hypocalcemia", bonus:true, card:{
      how:"Calcium below 8.6 mg/dL. Neuromuscular excitability rises, so muscles become twitchy and prone to spasm.",
      where:"Hypoparathyroidism, vitamin D deficiency, chronic kidney disease, pancreatitis, massive transfusion.",
      watch:"Chvostek and Trousseau signs are the named bedside tests, and airway assessment comes first because laryngospasm is the feared event.",
      nursing:"Assess airway and neuromuscular status, ECG if severe, seizure precautions if indicated, review magnesium and albumin, give calcium replacement as prescribed.",

    {id:"e11", name:"Hypercalcemia", bonus:true, card:{

    {id:"e12", name:"Hypomagnesemia", bonus:true, card:{

    {id:"e14", name:"Hypophosphatemia", bonus:true, card:{

    {id:"i721", box:"e5", term:"1 liter weighs 2.2 pounds", clue:"The conversion that makes daily weight a fluid measurement", fact:"1 kg equals 2.2 lb, so a 2.2 lb gain is about a liter."},
