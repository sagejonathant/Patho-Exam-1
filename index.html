(function(){
"use strict";

var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var S = {
  ri: 0, review:false, nameMode:"both", counts:false, ctrls:true,
  filter:null, placed:{}, wrong:0, attempts:{}, order:[],
  t0:null, elapsed:0, tick:null, done:false, sel:null, lastFocus:null
};

function round(){ return ROUNDS[S.ri]; }
function boxes(){ return round().boxes; }
function boxById(id){ var b=boxes(); for(var i=0;i<b.length;i++) if(b[i].id===id) return b[i]; return null; }
function itemById(id){ var it=round().items; for(var i=0;i<it.length;i++) if(it[i].id===id) return it[i]; return null; }
function activeItems(){
  var it = round().items;
  if(!S.filter) return it;
  var f = S.filter;
  return it.filter(function(x){ return f.indexOf(x.id)>=0; });
}
function remaining(){ return activeItems().filter(function(x){ return !S.placed[x.id]; }); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function buzz(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
function fmt(ms){ var s=Math.floor(ms/1000); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }

/* ---------- measured chrome heights ---------- */
function syncChrome(){
  var tb = $(".topbar");
  if(tb) document.documentElement.style.setProperty("--head-h", tb.offsetHeight + "px");
  var bk = $(".bank");
  if(bk) document.documentElement.style.setProperty("--bank-h", bk.offsetHeight + "px");
}
var chromeT = null;
function queueSync(){ clearTimeout(chromeT); chromeT = setTimeout(syncChrome, 60); }
window.addEventListener("resize", queueSync);
window.addEventListener("orientationchange", queueSync);
if(window.ResizeObserver){
  var ro = new ResizeObserver(queueSync);
  setTimeout(function(){
    var tb=$(".topbar"), bk=$(".bank");
    if(tb) ro.observe(tb);
    if(bk) ro.observe(bk);
  },0);
}

/* ---------- timer ---------- */
function startTimer(){
  stopTimer(); S.t0 = Date.now() - S.elapsed;
  S.tick = setInterval(function(){ S.elapsed = Date.now()-S.t0; $("#m-time").textContent = fmt(S.elapsed); },500);
}
function stopTimer(){ if(S.tick){ clearInterval(S.tick); S.tick=null; } }

/* ---------- tabs ---------- */
function renderTabs(){
  var host = $("#tabs"); host.innerHTML = "";
  ROUNDS.forEach(function(r,i){
    var b = document.createElement("button");
    b.className="tab"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", i===S.ri ? "true":"false");
    b.innerHTML = esc(r.title) + (r.bonus?' <span class="bonusdot">bonus</span>':"") +
      '<span class="n">'+ r.boxes.length +' boxes &middot; '+ r.items.length +' items</span>';
    b.addEventListener("click", function(){ goRound(i); });
    host.appendChild(b);
  });
}

/* ---------- round setup ---------- */
function goRound(i, filter){
  S.ri = i; S.filter = filter||null;
  S.placed={}; S.wrong=0; S.attempts={}; S.done=false; S.sel=null; S.elapsed=0;
  S.order = shuffle(activeItems().map(function(x){ return x.id; }));
  renderTabs(); renderRound();
  if(!S.review) startTimer(); else stopTimer();
  window.scrollTo(0,0);
}
function restart(){ goRound(S.ri, S.filter); }

function renderRound(){
  var r = round();
  $("#roundTitle").textContent = r.title;
  $("#roundBlurb").textContent = r.blurb;
  $("#scopeline").textContent = S.filter ? "drilling your misses" : "40 questions \u00b7 5 blueprint sections";

  var nh = $("#roundNotes"); nh.innerHTML = "";
  (r.notes||[]).forEach(function(n){
    var d=document.createElement("div"); d.className="note"+(n.type==="added"?" added":""); d.innerHTML=n.html; nh.appendChild(d);
  });

  renderBoard(); renderBank(); updateMetrics(); queueSync();
  $("#bankCol").style.display = S.review ? "none" : "";
  $$(".metric").forEach(function(m){ m.style.display = S.review ? "none" : ""; });
  $("#reviewToggle").setAttribute("aria-pressed", S.review?"true":"false");
}

/* ---------- board ---------- */
function boxPlacedItems(bid){
  if(S.review) return round().items.filter(function(x){ return x.box===bid; });
  return activeItems().filter(function(x){ return x.box===bid && S.placed[x.id]; });
}
function totalFor(bid){ return activeItems().filter(function(x){ return x.box===bid; }).length; }

function boxEl(b){
  var full = S.counts && !S.review && totalFor(b.id)>0 && boxPlacedItems(b.id).length===totalFor(b.id);
  var el = document.createElement("div");
  el.className = "box" + (b.bonus?" bonus":"") + (full?" done":"");
  el.dataset.box = b.id;
  el.setAttribute("tabindex","0");
  var tappable = S.review || S.done;
  if(tappable) el.classList.add("tappable");

  var head = '<div class="box-head">';
  if(b.seq) head += '<span class="box-seq">'+esc(b.seq)+'</span>';
  head += '<span class="box-name">'+esc(b.name)+'</span>';
  if(S.counts && !S.review) head += '<span class="box-count">'+boxPlacedItems(b.id).length+'/'+totalFor(b.id)+'</span>';
  if(tappable) head += '<span class="box-tap" title="Open detail card">i</span>';
  head += '</div>';

  var body = '<div class="box-body">';
  boxPlacedItems(b.id).forEach(function(it){
    body += '<div class="placed'+(it.badge?" flagged":"")+'">'+
      '<div class="p-term">'+esc(it.term)+(it.badge?'<span class="p-badge">'+esc(it.badge)+'</span>':"")+'</div>'+
      '<div class="p-clue">'+esc(it.clue)+'</div>'+
      '<div class="p-fact">'+esc(it.fact)+'</div></div>';
  });
  body += '</div>';

  el.innerHTML = head + body;
  el.addEventListener("click", function(){ onBoxActivate(b.id); });
  el.addEventListener("keydown", function(e){
    if(e.key==="Enter" || e.key===" "){ e.preventDefault(); onBoxActivate(b.id); }
  });
  return el;
}

function renderBoard(){
  var r = round(), host = $("#boardHost"); host.innerHTML = "";
  if(r.groups && r.groups.length){
    r.groups.forEach(function(g){
      var h=document.createElement("div"); h.className="groupname";
      var gp = 0, gt = 0;
      g.ids.forEach(function(id){ gp += boxPlacedItems(id).length; gt += totalFor(id); });
      var meter = "";
      if(!S.review && gt>0) meter = S.counts ? (gp+"/"+gt+" placed") : (gp ? gp+" placed" : "");
      h.innerHTML = esc(g.label) + (g.sub?' <em>'+esc(g.sub)+'</em>':"") +
                    (meter?'<span class="gct">'+esc(meter)+'</span>':"");
      host.appendChild(h);
      var grid=document.createElement("div"); grid.className="board";
      g.ids.forEach(function(id){ var b=boxById(id); if(b) grid.appendChild(boxEl(b)); });
      host.appendChild(grid);
    });
  } else {
    var grid=document.createElement("div"); grid.className="board";
    r.boxes.forEach(function(b){ grid.appendChild(boxEl(b)); });
    host.appendChild(grid);
  }
}

/* ---------- bank ---------- */
function tileHTML(it){
  var m = S.nameMode, h="";
  if(m==="term") h = '<span class="t-term">'+esc(it.term)+'</span>';
  else if(m==="clue") h = '<span class="t-clue" style="color:inherit;font-size:14px">'+esc(it.clue||it.term)+'</span>';
  else h = '<span class="t-term">'+esc(it.term)+'</span><span class="t-clue">'+esc(it.clue||"")+'</span>';
  return h;
}
function renderBank(){
  setArmed(!!S.sel);
  var host = $("#bankList"); host.innerHTML="";
  var rem = remaining();
  $("#bankLeft").textContent = rem.length ? rem.length+" left" : "";
  if(!rem.length){
    host.innerHTML = '<div class="bank-empty">Bank empty. Every item is on the board.</div>';
    return;
  }
  S.order.filter(function(id){ return !S.placed[id]; }).forEach(function(id){
    var it = itemById(id); if(!it) return;
    var t = document.createElement("div");
    t.className="tile"+(S.sel===id?" sel":"");
    t.dataset.item = id;
    t.setAttribute("tabindex","0");
    t.setAttribute("role","button");
    t.innerHTML = tileHTML(it);
    host.appendChild(t);
  });
}

function setArmed(on){
  var h = $("#boardHost"); if(h) h.classList.toggle("armed", !!on);
}
function updateMetrics(){
  var act = activeItems().length, pl = Object.keys(S.placed).length;
  $("#m-placed").innerHTML = "<b>"+pl+"</b>/<b id='m-total'>"+act+"</b> placed";
  $("#m-wrong").textContent = S.wrong;
  $("#m-time").textContent = fmt(S.elapsed);
  var f = $("#progFill");
  if(f) f.style.width = (S.review || !act) ? "0%" : Math.round(pl/act*100)+"%";
}

/* ---------- placement ---------- */
function place(itemId, boxId){
  var it = itemById(itemId); if(!it || S.placed[itemId]) return;
  if(it.box === boxId){
    S.placed[itemId] = true; S.sel = null;
    buzz(18);
    renderBoard(); renderBank(); updateMetrics();
    var el = $('.box[data-box="'+boxId+'"]');
    if(el){
      var r = el.getBoundingClientRect();
      var topLimit = 130, botLimit = window.innerHeight - (window.innerWidth<900 ? Math.round(window.innerHeight*0.46) : 20);
      if(r.top < topLimit || r.bottom > botLimit){
        el.scrollIntoView({block:"center", behavior: reduceMotion ? "auto" : "smooth"});
      }
    }
    if(remaining().length===0) finishRound();
  } else {
    S.wrong++;
    if(!S.attempts[itemId]) S.attempts[itemId]=[];
    if(S.attempts[itemId].indexOf(boxId)<0) S.attempts[itemId].push(boxId);
    buzz([25,60,25]);
    updateMetrics();
    var bx = $('.box[data-box="'+boxId+'"]');
    if(bx){ bx.classList.add("reject"); setTimeout(function(){ bx.classList.remove("reject"); },520); }
    var tl = $('.tile[data-item="'+itemId+'"]');
    if(tl){ tl.classList.remove("lifting"); tl.classList.add("wrong"); setTimeout(function(){ tl.classList.remove("wrong"); },430); }
  }
}

function onBoxActivate(bid){
  if(S.sel){ var s=S.sel; S.sel=null; place(s,bid); renderBank(); return; }
  if(S.review || S.done) openCard(bid);
}

/* ---------- pointer / drag ---------- */
var drag = null, ghost = null, rafId = null, edge = 0;

function makeGhost(it){
  var g = document.createElement("div"); g.className="ghost";
  g.innerHTML = '<span class="t-term">'+esc(it.term)+'</span>'+(it.clue?'<span class="t-clue">'+esc(it.clue)+'</span>':"");
  document.body.appendChild(g); return g;
}
function moveGhost(px,py){
  if(!ghost) return;
  var r = ghost.getBoundingClientRect();
  ghost.style.left = (px - r.width/2) + "px";
  ghost.style.top  = (py - r.height/2) + "px";
}
function hitBox(px,py){
  if(ghost) ghost.style.display="none";
  var el = document.elementFromPoint(px,py);
  if(ghost) ghost.style.display="";
  if(!el) return null;
  var b = el.closest ? el.closest(".box") : null;
  return b;
}
function highlight(b){
  $$(".box.over").forEach(function(x){ if(x!==b) x.classList.remove("over"); });
  if(b) b.classList.add("over");
}
function edgeLoop(){
  if(!drag){ rafId=null; return; }
  if(edge) window.scrollBy(0, edge);
  rafId = requestAnimationFrame(edgeLoop);
}
function beginDrag(itemId, px, py, touch){
  var it = itemById(itemId); if(!it) return;
  drag = { id:itemId, touch:!!touch };
  S.sel = null;
  var tl = $('.tile[data-item="'+itemId+'"]');
  if(tl) tl.classList.add("lifting");
  ghost = makeGhost(it);
  moveGhost(px,py);
  setArmed(true);
  if(touch) buzz(8);
  if(!rafId) rafId = requestAnimationFrame(edgeLoop);
}
function moveDrag(px,py,clientY){
  if(!drag) return;
  moveGhost(px,py);
  highlight(hitBox(px,py));
  var h = window.innerHeight;
  edge = clientY < 95 ? -14 : (clientY > h-95 ? 14 : 0);
}
function endDrag(px,py){
  if(!drag) return;
  setArmed(false);
  var id = drag.id, b = hitBox(px,py);
  var tl = $('.tile[data-item="'+id+'"]');
  $$(".box.over").forEach(function(x){ x.classList.remove("over"); });
  edge = 0;
  if(b && b.dataset.box){
    var it = itemById(id);
    if(it.box === b.dataset.box){ killGhost(); drag=null; place(id, b.dataset.box); return; }
    flyBack(tl, function(){ place(id, b.dataset.box); });
  } else {
    flyBack(tl, null);
  }
  drag = null;
}
function killGhost(){ if(ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost); ghost=null; }
function flyBack(tl, then){
  if(!ghost){ if(tl) tl.classList.remove("lifting"); if(then) then(); return; }
  if(!tl || reduceMotion){ killGhost(); if(tl) tl.classList.remove("lifting"); if(then) then(); return; }
  var g = ghost; ghost = null;
  var to = tl.getBoundingClientRect(), from = g.getBoundingClientRect();
  g.classList.add("flyback");
  g.style.transform = "translate("+(to.left-from.left)+"px,"+(to.top-from.top)+"px) scale(.96)";
  g.style.opacity = "0";
  setTimeout(function(){
    if(g.parentNode) g.parentNode.removeChild(g);
    tl.classList.remove("lifting");
    if(then) then();
  }, 250);
}

/* mouse */
var mdown = null;
document.addEventListener("mousedown", function(e){
  if(e.button!==0) return;
  var t = e.target.closest && e.target.closest(".tile");
  if(!t) return;
  mdown = { id:t.dataset.item, x:e.clientX, y:e.clientY, moved:false };
});
document.addEventListener("mousemove", function(e){
  if(drag && !drag.touch){ moveDrag(e.clientX, e.clientY, e.clientY); return; }
  if(!mdown) return;
  if(Math.abs(e.clientX-mdown.x)>4 || Math.abs(e.clientY-mdown.y)>4){
    mdown.moved = true;
    beginDrag(mdown.id, e.clientX, e.clientY, false);
  }
});
document.addEventListener("mouseup", function(e){
  if(drag && !drag.touch){ endDrag(e.clientX, e.clientY); mdown=null; return; }
  if(mdown && !mdown.moved){
    var id = mdown.id;
    S.sel = (S.sel===id) ? null : id;
    renderBank();
  }
  mdown = null;
});

/* touch */
var tdown = null, holdTimer = null;
document.addEventListener("touchstart", function(e){
  var t = e.target.closest && e.target.closest(".tile");
  if(!t || e.touches.length>1) return;
  var p = e.touches[0];
  tdown = { id:t.dataset.item, x:p.clientX, y:p.clientY, moved:false, held:false };
  clearTimeout(holdTimer);
  holdTimer = setTimeout(function(){
    if(!tdown || tdown.moved) return;
    tdown.held = true;
    beginDrag(tdown.id, tdown.x, tdown.y-50, true);
  }, 250);
}, {passive:true});

document.addEventListener("touchmove", function(e){
  if(!tdown) return;
  var p = e.touches[0];
  if(drag && drag.touch){
    e.preventDefault();
    moveDrag(p.clientX, p.clientY-50, p.clientY);
    return;
  }
  if(Math.abs(p.clientX-tdown.x)>10 || Math.abs(p.clientY-tdown.y)>10){
    tdown.moved = true; clearTimeout(holdTimer);
  }
}, {passive:false});

document.addEventListener("touchend", function(e){
  clearTimeout(holdTimer);
  if(drag && drag.touch){
    var p = e.changedTouches[0];
    endDrag(p.clientX, p.clientY-50);
    tdown=null; return;
  }
  if(tdown && !tdown.moved && !tdown.held){
    var id = tdown.id;
    S.sel = (S.sel===id) ? null : id;
    renderBank();
  }
  tdown = null;
}, {passive:true});
document.addEventListener("touchcancel", function(){
  clearTimeout(holdTimer);
  if(drag){ var tl=$('.tile[data-item="'+drag.id+'"]'); killGhost(); if(tl) tl.classList.remove("lifting"); drag=null; edge=0; setArmed(false); }
  tdown=null;
}, {passive:true});

/* keyboard on tiles */
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){
    if(!$("#scrim").hidden){ closeSheet(); return; }
    if(S.sel){ S.sel=null; renderBank(); return; }
  }
  var t = e.target.closest && e.target.closest(".tile");
  if(t && (e.key==="Enter" || e.key===" ")){
    e.preventDefault();
    var id = t.dataset.item;
    if(S.sel===id){ S.sel=null; renderBank(); return; }
    S.sel = id; renderBank();
    var first = $(".box"); if(first) first.focus();
  }
});

/* ---------- results ---------- */
function finishRound(){
  S.done = true; stopTimer();
  renderBoard();
  var act = activeItems();
  var missedIds = Object.keys(S.attempts);
  var firstTry = act.length - missedIds.length;
  var pct = act.length ? Math.round(firstTry/act.length*100) : 100;

  var h = '<div class="resultgrid">'+
    '<div><div class="bignum">'+pct+'%</div><div class="lbl">first-try accuracy</div></div>'+
    '<div><div class="bignum">'+S.wrong+'</div><div class="lbl">wrong drops</div></div>'+
    '<div><div class="bignum">'+fmt(S.elapsed)+'</div><div class="lbl">time</div></div>'+
    '<div><div class="bignum">'+firstTry+'/'+act.length+'</div><div class="lbl">clean placements</div></div>'+
    '</div>';

  if(missedIds.length){
    h += '<div class="sec"><h4>What you missed</h4>';
    missedIds.forEach(function(id){
      var it = itemById(id); if(!it) return;
      var right = boxById(it.box);
      var wrongNames = S.attempts[id].map(function(b){ var x=boxById(b); return x?x.name:b; });
      h += '<div class="missitem"><div class="m-term">'+esc(it.term)+'</div>'+
           '<div class="m-line">Belongs in <b>'+esc(right?right.name:it.box)+'</b></div>'+
           '<div class="m-line">You tried <i>'+esc(wrongNames.join(", "))+'</i></div>'+
           '<div class="m-line">'+esc(it.fact)+'</div></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="sec"><h4>What you missed</h4><p>Nothing. Every item went in on the first try.</p></div>';
  }

  h += '<div class="actions">';
  if(missedIds.length) h += '<button class="abtn primary" data-act="drill">Drill my misses ('+missedIds.length+')</button>';
  h += '<button class="abtn" data-act="key">Show answer key</button>'+
       '<button class="abtn" data-act="replay">Replay this round</button>';
  if(S.ri < ROUNDS.length-1) h += '<button class="abtn" data-act="next">Next round</button>';
  h += '<button class="abtn" data-act="close">Close</button></div>';

  openSheet(round().title, "Round complete", h);
  $$("#sheetBody .abtn").forEach(function(b){
    b.addEventListener("click", function(){
      var a = b.dataset.act;
      if(a==="drill"){ closeSheet(); goRound(S.ri, missedIds.slice()); }
      else if(a==="key"){ showKey(); }
      else if(a==="replay"){ closeSheet(); goRound(S.ri, S.filter); }
      else if(a==="next"){ closeSheet(); goRound(S.ri+1); }
      else closeSheet();
    });
  });
}

function showKey(){
  var h = '<div class="keygrid">';
  boxes().forEach(function(b){
    h += '<div class="keybox"><h5>'+esc(b.name)+(b.bonus?' <span class="p-badge">bonus</span>':"")+'</h5><ul>';
    round().items.filter(function(x){ return x.box===b.id; }).forEach(function(x){
      h += '<li>'+esc(x.term)+'</li>';
    });
    h += '</ul></div>';
  });
  h += '</div><div class="actions"><button class="abtn" id="keyBack">Back</button></div>';
  openSheet(round().title, "Answer key", h);
  $("#keyBack").addEventListener("click", function(){ closeSheet(); finishRound(); });
}

/* ---------- detail card ---------- */
function openCard(bid){
  var b = boxById(bid); if(!b || !b.card) return;
  var c = b.card;
  var its = round().items.filter(function(x){ return x.box===bid; });
  var h = "";
  h += '<div class="sec"><h4>How it works</h4><p>'+esc(c.how)+'</p></div>';
  h += '<div class="sec"><h4>Where you will see it</h4><p>'+esc(c.where)+'</p></div>';
  h += '<div class="sec"><h4>Watch for</h4><p>'+esc(c.watch)+'</p></div>';
  h += '<div class="sec"><h4>Nursing and teaching</h4><p>'+esc(c.nursing)+'</p></div>';
  h += '<div class="sec"><h4>What sets the items apart</h4>'+
       '<div class="sub">Every item that belongs in this box, and the detail that distinguishes it.</div><ul>';
  its.forEach(function(x){
    h += '<li><b>'+esc(x.term)+'</b> &mdash; '+esc(x.clue)+'. '+esc(x.fact)+
         (x.badge?' <span class="p-badge">'+esc(x.badge)+'</span>':"")+'</li>';
  });
  (c.apart||[]).forEach(function(a){
    h += '<li><b>'+esc(a.t)+'</b> &mdash; '+esc(a.d)+'</li>';
  });
  h += '</ul></div>';
  if(b.bonus) h += '<div class="note">Bonus content. It is in the slides but not on the Exam 1 blueprint.</div>';
  openSheet(b.name, round().title, h);
}

/* ---------- sheet ---------- */
function openSheet(title, kicker, html){
  S.lastFocus = document.activeElement;
  $("#sheetTitle").textContent = title;
  $("#sheetKicker").textContent = kicker;
  $("#sheetBody").innerHTML = html;
  $("#scrim").hidden = false;
  $("#sheetClose").focus();
}
function closeSheet(){
  $("#scrim").hidden = true;
  $("#sheetBody").innerHTML = "";
  if(S.lastFocus && S.lastFocus.focus) S.lastFocus.focus();
}
$("#sheetClose").addEventListener("click", closeSheet);
$("#scrim").addEventListener("mousedown", function(e){ if(e.target === $("#scrim")) closeSheet(); });

/* ---------- controls ---------- */
$$(".seg button").forEach(function(b){
  b.addEventListener("click", function(){
    S.nameMode = b.dataset.name;
    $$(".seg button").forEach(function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false"); });
    renderBank();
  });
});
$("#countsChk").addEventListener("change", function(){ S.counts = this.checked; renderBoard(); });
$("#shuffleBtn").addEventListener("click", function(){ S.order = shuffle(S.order.slice()); renderBank(); });
$("#restartBtn").addEventListener("click", restart);
$("#ctrlToggle").addEventListener("click", function(){
  S.ctrls = !S.ctrls;
  $("#bankCtrls").hidden = !S.ctrls;
  this.setAttribute("aria-expanded", S.ctrls?"true":"false");
  this.textContent = S.ctrls ? "Hide controls" : "Controls";
});
$("#reviewToggle").addEventListener("click", function(){
  S.review = !S.review;
  S.sel = null;
  if(S.review) stopTimer(); else if(!S.done) startTimer();
  renderRound();
  window.scrollTo(0,0);
});

/* ---------- init ---------- */
$$(".seg button").forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.name===S.nameMode ? "true":"false"); });
renderTabs();
goRound(0);
syncChrome();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncChrome);
})();
</script>
</body>
</html>
